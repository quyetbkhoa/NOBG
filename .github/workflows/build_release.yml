name: Build Android Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
            echo "keystore.path=/tmp/keystore.jks" >> local.properties
            echo "keystore.password=$KEYSTORE_PASSWORD" >> local.properties
            echo "key.alias=$KEY_ALIAS" >> local.properties
            echo "key.password=$KEY_PASSWORD" >> local.properties
            echo "Keystore configured successfully."
          else
            echo "No keystore secret found, will use debug signing."
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Find APK and verify
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          echo "Found APK: $APK"
          ls -lh "$APK"
          echo "path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOBG-Release-APK
          path: ${{ steps.apk.outputs.path }}

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "NOBG Latest Release"
          body: "Tự động build bản Release APK mới nhất từ branch main."
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send APK to Telegram Bot
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          python3 -c '
          import os, sys, urllib.request

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          apk_path = os.environ.get("APK_PATH", "").strip()
          commit_sha = os.environ.get("COMMIT_SHA", "")[:7]
          commit_msg = os.environ.get("COMMIT_MSG", "").split("\n")[0][:80]

          if not token or not chat_id:
              print("Chua cau hinh TELEGRAM secrets. Bo qua.")
              sys.exit(0)

          if not os.path.exists(apk_path):
              print(f"File APK khong ton tai tai: {apk_path}")
              sys.exit(1)

          url = f"https://api.telegram.org/bot{token}/sendDocument"
          caption = f"🚀 NOBG Release APK (v2.1.0)\n📌 Commit: {commit_sha}\n📝 {commit_msg}"

          print(f"Sending APK ({os.path.getsize(apk_path)} bytes) to Telegram chat: {chat_id}...")

          with open(apk_path, "rb") as f:
              file_bytes = f.read()

          boundary = "---------------------------12345678901234567890"
          body = []
          body.append(f"--{boundary}\r\nContent-Disposition: form-data; name=\"chat_id\"\r\n\r\n{chat_id}".encode("utf-8"))
          body.append(f"--{boundary}\r\nContent-Disposition: form-data; name=\"caption\"\r\n\r\n{caption}".encode("utf-8"))
          body.append(f"--{boundary}\r\nContent-Disposition: form-data; name=\"document\"; filename=\"NOBG-v2.1.0-release.apk\"\r\nContent-Type: application/vnd.android.package-archive\r\n\r\n".encode("utf-8") + file_bytes)
          body.append(f"\r\n--{boundary}--\r\n".encode("utf-8"))

          payload = b"\r\n".join(body)

          req = urllib.request.Request(
              url,
              data=payload,
              headers={"Content-Type": f"multipart/form-data; boundary={boundary}"}
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  res = resp.read().decode("utf-8")
                  print("Telegram API Success Response:", res)
          except Exception as e:
              print("Telegram API Upload Failed Error:", e)
              if hasattr(e, "read"):
                  print("Error details:", e.read().decode("utf-8"))
              sys.exit(1)
          '









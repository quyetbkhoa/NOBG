name: Build Android Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
            echo "keystore.path=/tmp/keystore.jks" >> local.properties
            echo "keystore.password=$KEYSTORE_PASSWORD" >> local.properties
            echo "key.alias=$KEY_ALIAS" >> local.properties
            echo "key.password=$KEY_PASSWORD" >> local.properties
            echo "Keystore configured successfully."
          else
            echo "No keystore secret found, will use debug signing."
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Find APK and verify
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found!"
            exit 1
          fi
          echo "Found APK: $APK"
          ls -lh "$APK"
          echo "path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOBG-Release-APK
          path: ${{ steps.apk.outputs.path }}

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "NOBG Latest Release"
          body: "Tự động build bản Release APK mới nhất từ branch main."
          files: ${{ steps.apk.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send APK to Telegram Bot
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Thieu TELEGRAM secret. Bo qua."
            exit 0
          fi
          cp "$APK_PATH" /tmp/nobg_release.apk
          SHORT_SHA="${COMMIT_SHA:0:7}"
          CLEAN_MSG=$(printf '%s' "$COMMIT_MSG" | head -n 1 | cut -c1-100)
          echo "Sending to Telegram chat: $TELEGRAM_CHAT_ID"
          HTTP_CODE=$(curl -s -o /tmp/tg_response.json -w "%{http_code}" \
               -F chat_id="$TELEGRAM_CHAT_ID" \
               -F document=@/tmp/nobg_release.apk \
               -F caption="NOBG New Release - $SHORT_SHA - $CLEAN_MSG" \
               "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument")
          cat /tmp/tg_response.json
          echo ""
          echo "HTTP Status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Telegram API returned non-200 status: $HTTP_CODE"
            exit 1
          fi
          echo "APK sent to Telegram successfully!"








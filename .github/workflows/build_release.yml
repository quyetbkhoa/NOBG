name: Build Android Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOBG-Release-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "NOBG Latest Release"
          body: "Tự động build bản Release APK mới nhất từ branch main."
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send APK to Telegram Bot
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "Sending APK to Telegram..."
            APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
            if [ -z "$APK_FILE" ]; then
              echo "Không tìm thấy file APK trong app/build/outputs/apk/release/"
              exit 1
            fi
            echo "File APK tìm thấy: $APK_FILE"
            SHORT_SHA="${COMMIT_SHA:0:7}"
            CLEAN_MSG=$(echo "$COMMIT_MSG" | head -n 1 | tr -d '"'\''`')
            CAPTION="🚀 NOBG Release APK mới nhất!
📌 Commit: ${SHORT_SHA}
📝 Nội dung: ${CLEAN_MSG}"
            
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
                 -F chat_id="$TELEGRAM_CHAT_ID" \
                 -F document=@"$APK_FILE" \
                 -F caption="$CAPTION" \
                 https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument)
            echo "Kết quả gửi Telegram: $RESPONSE"
          else
            echo "Chưa cấu hình TELEGRAM_BOT_TOKEN hoặc TELEGRAM_CHAT_ID trong Secrets. Bỏ qua gửi Telegram."
          fi




name: Build Android Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOBG-Release-APK
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "NOBG Latest Release"
          body: "Tự động build bản Release APK mới nhất từ branch main."
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send APK to Telegram Bot
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            echo "Sending APK to Telegram..."
            curl -s -F chat_id="$TELEGRAM_CHAT_ID" \
                 -F document=@app/build/outputs/apk/release/app-release.apk \
                 -F caption="🚀 *NOBG Release APK mới nhất!*%0A📌 *Commit:* `${GITHUB_SHA:0:7}`%0A📝 *Nội dung:* ${{ github.event.head_commit.message }}" \
                 -F parse_mode="Markdown" \
                 https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument
          else
            echo "Chưa cấu hình TELEGRAM_BOT_TOKEN hoặc TELEGRAM_CHAT_ID trong Secrets. Bỏ qua gửi Telegram."
          fi

